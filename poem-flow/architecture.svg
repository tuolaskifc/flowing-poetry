<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc"><title id="title">流动诗当前架构，语义3.3贯通版</title><desc id="desc">诗句输入，经DeepSeek结构化语义和本地校验，进入视觉策略、场景组织、绘画合成和交互。失败记录、未支持语义与后续规划单列。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#78958b"/></marker></defs><rect width="1280" height="1280" fill="#f7f7ef"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="40" y="52" font-size="32" fill="#294b42" font-weight="600">流动诗 · 当前架构</text><text x="40" y="83" font-size="16" fill="#79887e" font-weight="400">语义 3.3 贯通版  /  2026-10-23</text><rect x="40" y="112" width="1200" height="85" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="64" y="149" font-size="24" fill="#294b42" font-weight="600">诗句输入</text><text x="64" y="184" font-size="19" fill="#38564e" font-weight="400">手动输入 / 人工精选库 / 今日诗词候选初筛；选择与浏览不调用模型</text><path d="M 310 197 V 240" fill="none" stroke="#78958b" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="326" y="224" font-size="15" fill="#38564e" font-weight="400">点击生成；命中最近成功缓存则复用</text><rect x="40" y="240" width="540" height="204" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="64" y="277" font-size="24" fill="#294b42" font-weight="600">DeepSeek · 结构化语义解释</text><text x="64" y="312" font-size="19" fill="#38564e" font-weight="400">意象、数量、在场与比喻</text><text x="64" y="341" font-size="19" fill="#38564e" font-weight="400">整体环境、主次、群落与远近</text><text x="64" y="370" font-size="19" fill="#38564e" font-weight="400">必要依托、主导动作、可见气息</text><text x="64" y="399" font-size="19" fill="#38564e" font-weight="400">每项保留原文依据与推断标记</text><rect x="700" y="240" width="540" height="204" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="724" y="277" font-size="24" fill="#294b42" font-weight="600">本地校验</text><text x="724" y="312" font-size="19" fill="#38564e" font-weight="400">字段、实体、数量与原文依据</text><text x="724" y="341" font-size="19" fill="#38564e" font-weight="400">可受限展开相邻原句引用，标记待复核</text><text x="724" y="370" font-size="19" fill="#38564e" font-weight="400">不改变解释；未通过时不画新图</text><text x="724" y="399" font-size="19" fill="#38564e" font-weight="400">原始请求、回答和失败保持可追溯</text><path d="M 580 337 H 700" fill="none" stroke="#78958b" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="597" y="321" font-size="15" fill="#38564e" font-weight="400">语义 JSON</text><path d="M 970 444 V 480 H 640 V 511" fill="none" stroke="#78958b" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="982" y="476" font-size="15" fill="#38564e" font-weight="400">校验通过</text><rect x="40" y="511" width="1200" height="232" rx="15" fill="#e8f0e8" stroke="#a4bfae" stroke-width="1.5"/><text x="64" y="550" font-size="25" fill="#294b42" font-weight="600">本地视觉策略与场景组织</text><rect x="61" y="573" width="365" height="148" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="85" y="610" font-size="21" fill="#294b42" font-weight="600">语义 → 画面组织</text><text x="85" y="645" font-size="17" fill="#38564e" font-weight="400">32 类画笔与数量策略</text><text x="85" y="674" font-size="17" fill="#38564e" font-weight="400">主次、群落、远近 → 比例分布</text><text x="85" y="703" font-size="17" fill="#38564e" font-weight="400">推断环境单列，不增加原文实体</text><rect x="449" y="573" width="365" height="148" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="473" y="610" font-size="21" fill="#294b42" font-weight="600">依托 → 合理布局</text><text x="473" y="645" font-size="17" fill="#38564e" font-weight="400">地面、水域、山体与局部附着</text><text x="473" y="674" font-size="17" fill="#38564e" font-weight="400">区域提案 / 三个通用布局</text><text x="473" y="703" font-size="17" fill="#38564e" font-weight="400">检查数量依托；最多两轮修正</text><rect x="837" y="573" width="381" height="148" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="861" y="610" font-size="21" fill="#294b42" font-weight="600">状态与气息 → 视觉参数</text><text x="861" y="645" font-size="17" fill="#38564e" font-weight="400">支持的姿态、微动与定性节奏</text><text x="861" y="674" font-size="17" fill="#38564e" font-weight="400">照明配色、迷蒙时远景淡化</text><text x="861" y="703" font-size="17" fill="#38564e" font-weight="400">逐项记录应用、空缺与保留</text><path d="M 640 743 V 776 H 310 V 807" fill="none" stroke="#78958b" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="40" y="807" width="540" height="147" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="64" y="844" font-size="24" fill="#294b42" font-weight="600">p5 画笔 + Canvas 合成</text><text x="64" y="879" font-size="19" fill="#38564e" font-weight="400">共享笔触源；图层、裁切、透明度</text><text x="64" y="908" font-size="19" fill="#38564e" font-weight="400">画笔时钟与有限观看运动</text><text x="64" y="937" font-size="19" fill="#38564e" font-weight="400">本地规则决定坐标、尺寸、笔触与配色</text><rect x="700" y="807" width="540" height="147" rx="15" fill="#fffdf7" stroke="#b8cac0" stroke-width="1.5"/><text x="724" y="844" font-size="24" fill="#294b42" font-weight="600">网页观看与调整</text><text x="724" y="879" font-size="19" fill="#38564e" font-weight="400">22 套配色 / 动态程度 / 风力 / 月形</text><text x="724" y="908" font-size="19" fill="#38564e" font-weight="400">暂停 / 拖动与附着 / 沉浸 / PNG</text><text x="724" y="937" font-size="19" fill="#38564e" font-weight="400">这些调整不新增模型调用</text><path d="M 580 878 H 700" fill="none" stroke="#78958b" stroke-width="2.2"  marker-end="url(#arrow)"/><rect x="40" y="991" width="756" height="112" rx="15" fill="#eff3ee" stroke="#b8cac0" stroke-width="1.5"/><text x="64" y="1028" font-size="21" fill="#294b42" font-weight="600">贯穿记录与自查</text><text x="64" y="1063" font-size="17" fill="#38564e" font-weight="400">原始回答 + 语义消费记录 + 绘画缺口 + 浏览器重放</text><text x="64" y="1092" font-size="17" fill="#38564e" font-weight="400">自动检查和字段被使用，均不等于诗意与审美已经正确</text><rect x="836" y="991" width="404" height="112" rx="15" fill="#f4eee5" stroke="#c4b5a2" stroke-width="1.5"/><text x="860" y="1028" font-size="21" fill="#294b42" font-weight="600">失败保持可见</text><text x="860" y="1063" font-size="17" fill="#38564e" font-weight="400">校验失败：保存原因，不画新图</text><text x="860" y="1092" font-size="17" fill="#38564e" font-weight="400">未支持的语义：保留解释与空缺</text><path d="M 1240 337 H 1262 V 975 H 1040 V 991" fill="none" stroke="#b5a38c" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="40" y="1135" width="1200" height="109" rx="15" fill="#f6f2e9" stroke="#baa88d" stroke-width="1.5" stroke-dasharray="7 5"/><text x="64" y="1171" font-size="22" fill="#8c7656" font-weight="600">仍待实现</text><text x="64" y="1201" font-size="20" fill="#796c59" font-weight="400">完整因果与多阶段时间 · 完整情绪自动配色 · 整首诗分镜</text><text x="64" y="1227" font-size="16" fill="#887d6c" font-weight="400">本版仍面向短句或节选；人物采用简洁写意点景，优先完善整体风景、色彩与动态。</text></g></svg>
