<main><section class="intro"><h1>抽象试画</h1></section>
<div class="workspace"><aside class="panel"><label class="sample-picker"><span class="sr-only">精选诗句</span><select id="sample"></select></label><label class="poem-input"><span class="sr-only">诗句</span><textarea id="poem" maxlength="200" spellcheck="false" aria-label="待分析的诗句"></textarea></label><button class="primary" id="generate" disabled>生成画面</button><p class="small" id="source"></p><details><summary>画面调整</summary><label><span>铺展程度</span><input id="expanse" type="range" min="0" max="1" step=".05" value=".9"></label><label><span>动态程度</span><input id="motion" type="range" min="0" max="2" step=".05" value="1"></label><label><span>笔触疏密</span><input id="density" type="range" min="0" max="1" step=".05" value=".55"></label><label><span>拖动留痕</span><input id="trace" type="range" min="0" max="1" step=".05" value=".55"></label><label><span>点击回应</span><input id="response" type="range" min="0" max="1" step=".05" value=".65"></label><label class="check"><input id="hybrid" type="checkbox" disabled>叠加诗中已有的景物</label></details></aside>
<section class="stage"><div class="toolbar"><label>画法<select id="style"></select></label><label>配色<select id="palette"></select></label><button id="reseed">换一种生成</button></div><canvas id="art" width="960" height="600" role="img" aria-label="可以点击扰动、逐个拖动和留下痕迹的抽象诗句画面"></canvas><div class="caption"><strong id="poem-title">正在准备画面</strong></div><div class="buttons"><button id="pause" aria-pressed="false">暂停</button><button id="stir">轻拨画面</button><button id="restart">从头观看／还原</button><button id="save">保存 PNG</button></div><details class="view-help"><summary>操作说明</summary><p>点击画面扰动笔触，拖动抽象形态留下痕迹；依附景物的纹理随景保留。铺展程度调至零可回看局部画法。</p></details><p id="status" role="status" aria-live="polite">正在载入已保存的真实解读……</p><p id="review-note" class="notice" hidden></p><details><summary>诗句解读</summary><p id="reading"></p><ul id="relations"></ul><ul id="processes"></ul></details><details><summary>歧义与待复核</summary><ul id="uncertainties"></ul></details><details><summary>画法记录</summary><p class="seed" id="seed-label"></p><p class="small" id="palette-name"></p><ul id="choices"></ul></details></section></div>
<section class="samples"><h2>同一句诗，也可以这样画</h2><div class="variants" id="variants"></div></section><footer><details><summary>关于此页</summary><p>抽象试验采用独立语义协议；模型解释文字，本地程序负责画法。原诗、画笔来源和失败记录均保留；当前表达不是唯一解读，也仍待审阅。</p></details></footer></main>
