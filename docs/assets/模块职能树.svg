<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1110" viewBox="0 0 1660 1110" role="img" aria-labelledby="title description"><title id="title">流动诗模块职能树</title><desc id="description">五个主要部分，其中视觉规则展开为意象、情感、强度、关系、逻辑、时间六个指标。图中标注已实现、独立实验和待实现。</desc><rect x="0" y="0" width="1660" height="1110" rx="0" fill="#F6F3EC" stroke="none" /><text x="40" y="53" font-size="34" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">流动诗 · 模块与职能树</text><text x="40" y="86" font-size="18" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">目标结构与当前进度  /  2026-10-18</text><rect x="640" y="112" width="380" height="104" rx="12" fill="#244B46" stroke="none" /><text x="830" y="155" font-size="32" font-family="Microsoft YaHei" fill="#FFFFFF" font-weight="bold" text-anchor="middle">流动诗</text><text x="830" y="187" font-size="20" font-family="Microsoft YaHei" fill="#E5EDE4" font-weight="normal" text-anchor="middle">诗句 → 意象 → 图形 → 意境</text><path d="M 830 216 V 245 M 190 245 H 1470" fill="none" stroke="#9DADA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 190 245 V 276" fill="none" stroke="#9DADA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="40" y="276" width="300" height="100" rx="12" fill="#F4EBDD" stroke="#D6DBD1" /><text x="58" y="314" font-size="24" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">1  输入与意图</text><text x="58" y="346" font-size="18" font-family="Microsoft YaHei" fill="#8B7548" font-weight="normal" text-anchor="start">规划 · 待接入</text><path d="M 190 376 V 398 H 48 V 634" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 48 458 H 64" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="64" y="420" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="78" y="450" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">原句与节选</text><text x="78" y="476" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">古诗起步，现代诗与歌词后续</text><path d="M 48 546 H 64" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="64" y="508" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="78" y="538" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">用户解读</text><text x="78" y="564" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">保留特别的艺术选择</text><path d="M 48 634 H 64" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="64" y="596" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="78" y="626" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">诗库与随机选句</text><text x="78" y="652" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">来源后续探索，尚未接入</text><path d="M 510 245 V 276" fill="none" stroke="#9DADA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="360" y="276" width="300" height="100" rx="12" fill="#E7EFF1" stroke="#D6DBD1" /><text x="378" y="314" font-size="24" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">2  语义分析与检查</text><text x="378" y="346" font-size="18" font-family="Microsoft YaHei" fill="#557785" font-weight="normal" text-anchor="start">独立实验 · 未连网页</text><path d="M 510 376 V 398 H 368 V 634" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 368 458 H 384" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="384" y="420" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="398" y="450" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">LLM 语义解释</text><text x="398" y="476" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">意象、联系、原文依据</text><path d="M 368 546 H 384" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="384" y="508" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="398" y="538" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">固定输出协议</text><text x="398" y="564" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">3.0 已离线检查，待接口实测</text><path d="M 368 634 H 384" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="384" y="596" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="398" y="626" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">依据与引用检查</text><text x="398" y="652" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">保留歧义，不执行模型代码</text><path d="M 830 245 V 276" fill="none" stroke="#9DADA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="680" y="276" width="300" height="100" rx="12" fill="#F4EBDD" stroke="#D6DBD1" /><text x="698" y="314" font-size="24" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">3  视觉规则</text><text x="698" y="346" font-size="18" font-family="Microsoft YaHei" fill="#8B7548" font-weight="normal" text-anchor="start">已有规范 · 待实现</text><path d="M 830 376 V 398 H 688 V 898" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 688 458 H 704" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="704" y="420" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="718" y="450" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">意象 → 形态线索</text><text x="718" y="476" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">主体、轮廓与比喻参照</text><path d="M 688 546 H 704" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="704" y="508" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="718" y="538" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">情感 → 配色</text><text x="718" y="564" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">16 类色彩组合与使用</text><path d="M 688 634 H 704" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="704" y="596" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="718" y="626" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">强度 → 空间</text><text x="718" y="652" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">紧密度、利用率，档位待定</text><path d="M 688 722 H 704" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="704" y="684" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="718" y="714" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">关系 → 图形联系</text><text x="718" y="740" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">连接、靠近、包围、排斥等</text><path d="M 688 810 H 704" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="704" y="772" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="718" y="802" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">逻辑 → 成立方式</text><text x="718" y="828" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">否定、可能、条件与范围</text><path d="M 688 898 H 704" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="704" y="860" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="718" y="890" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">时间 → 变化过程</text><text x="718" y="916" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">先后、反复、未然与留痕</text><path d="M 1150 245 V 276" fill="none" stroke="#9DADA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1000" y="276" width="300" height="100" rx="12" fill="#E7EEE8" stroke="#D6DBD1" /><text x="1018" y="314" font-size="24" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">4  绘画与交互</text><text x="1018" y="346" font-size="18" font-family="Microsoft YaHei" fill="#58735E" font-weight="normal" text-anchor="start">固定诗句原型已实现</text><path d="M 1150 376 V 398 H 1008 V 722" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1008 458 H 1024" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1024" y="420" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="1038" y="450" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">持续绘图</text><text x="1038" y="476" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">p5.js 动态画面</text><path d="M 1008 546 H 1024" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1024" y="508" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="1038" y="538" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">观看与交互</text><text x="1038" y="564" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">重演、暂停、导出、沉浸</text><path d="M 1008 634 H 1024" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1024" y="596" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="1038" y="626" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">任意诗句接入</text><text x="1038" y="652" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">尚未贯通语义与绘图</text><path d="M 1008 722 H 1024" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1024" y="684" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="1038" y="714" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">安卓适配</text><text x="1038" y="740" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">后续方向，尚未实现</text><path d="M 1470 245 V 276" fill="none" stroke="#9DADA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1320" y="276" width="300" height="100" rx="12" fill="#E7EEE8" stroke="#D6DBD1" /><text x="1338" y="314" font-size="24" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">5  记录与验证</text><text x="1338" y="346" font-size="18" font-family="Microsoft YaHei" fill="#58735E" font-weight="normal" text-anchor="start">已有记录 · 持续验证</text><path d="M 1470 376 V 398 H 1328 V 634" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1328 458 H 1344" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1344" y="420" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="1358" y="450" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">Git 版本记录</text><text x="1358" y="476" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">保存可回查的小步骤</text><path d="M 1328 546 H 1344" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1344" y="508" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="1358" y="538" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">API 实验与失败</text><text x="1358" y="564" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">原始回答保留，不改写</text><path d="M 1328 634 H 1344" fill="none" stroke="#B3BDB4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1344" y="596" width="276" height="76" rx="8" fill="#FFFDFA" stroke="#D8DED4" /><text x="1358" y="626" font-size="21" font-family="Microsoft YaHei" fill="#2E413C" font-weight="bold" text-anchor="start">技术与审美检查</text><text x="1358" y="652" font-size="16" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">结构通过仍需人工判断</text><path d="M 40 1006 H 1620" fill="none" stroke="#D6DDD2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="1041" font-size="22" font-family="Microsoft YaHei" fill="#2E413C" font-weight="normal" text-anchor="start">现状：固定句网页可用；LLM 为独立实验；六指标驱动绘图尚未贯通。</text><text x="40" y="1077" font-size="20" font-family="Microsoft YaHei" fill="#748076" font-weight="normal" text-anchor="start">职责：LLM 解释文字，本地规则决定画法，用户判断诗意与审美。</text></svg>
